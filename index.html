    <style>
      /* ============================================================
         Late-Jobs era, 2011: iOS 6 / Lion materials, Jobs restraint.
         Dark linen, brushed metal, one glossy gel button, embossed
         Helvetica Neue. Nothing on screen that isn't the episode.
         ============================================================ */
      :root {
        color-scheme: dark;
        /* One typeface, defined once — Jobs' final era: Helvetica Neue
           everywhere, hierarchy from weight and size alone. No webfont,
           no serif, no mono, no second family anywhere in the app. */
        --font: "Helvetica Neue", Helvetica, sans-serif;
        /* The whole type ramp: six sizes, four weights (300/400/500/600). */
        --fs-micro: 12px;
        --fs-small: 14px;
        --fs-control: 15px;
        --fs-body: 17px;
        --fs-title: 20px;
        --fs-display: 36px;
        --fs-display: clamp(30px, 6.5vw, 42px);
        --text: #f2f2f4;
        --quiet: #b6b6bd;
        --faint: #8f8f98;
        --accent: #6db3f2;
        --backdrop: rgba(0, 0, 0, 0.52);
        --sheet-shadow: 0 -18px 55px rgba(0, 0, 0, 0.65);

        /* Woven linen: fine cross-hatch threads over a base colour. */
        --linen:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0, rgba(255, 255, 255, 0.028) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.16) 0, rgba(0, 0, 0, 0.16) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0, rgba(0, 0, 0, 0.12) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 3px);

        /* Brushed metal: vertical grain over a steel gradient. */
        --metal:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0, rgba(255, 255, 255, 0.035) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.03) 0, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 2px),
          linear-gradient(180deg, #a4a4ab 0%, #85858c 48%, #6f6f76 52%, #606067 100%);

        /* Glossy gel: a hard highlight across the top half. */
        --gel:
          linear-gradient(180deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.15) 48%, rgba(255, 255, 255, 0) 52%, rgba(0, 0, 0, 0.07) 100%),
          linear-gradient(180deg, #70b2f5 0%, #2f7de0 52%, #1a66c9 100%);
        --gel-dark:
          linear-gradient(180deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.06) 48%, rgba(0, 0, 0, 0.10) 52%, rgba(0, 0, 0, 0.22) 100%),
          linear-gradient(180deg, #56565d 0%, #333338 100%);
      }

      * { box-sizing: border-box; }
      /* Every control inherits the one typeface from this single rule —
         no per-component font declarations anywhere else. */
      button, input { font-family: inherit; }
      html, body { margin: 0; padding: 0; }
      body {
        background-color: #252529;
        background-image:
          radial-gradient(120% 70% at 50% -10%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 60%),
          var(--linen);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* The linen darkens at the edges, like the real panel. */
      body::before {
        content: "";
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateZ(0);
        pointer-events: none;
        box-shadow: inset 0 0 170px rgba(0, 0, 0, 0.5);
      }

      main {
        width: 100%;
        max-width: 880px;
        padding: 28px 20px 40px;
        padding: clamp(16px, 4vh, 44px) 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      /* ---------- The episode, in a device bezel ---------- */
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: linear-gradient(180deg, #5b5b62, #2a2a2e 10%, #131315 90%, #3b3b41);
        border: 1px solid #050506;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 rgba(255, 255, 255, 0.07),
          0 22px 55px rgba(0, 0, 0, 0.6),
          0 3px 10px rgba(0, 0, 0, 0.55);
        animation: stageIn 0.45s ease;
      }
      @keyframes stageIn { from { opacity: 0; } to { opacity: 1; } }
      /* An episode change is a crossfade, never a hard cut. */
      .stage.switching video { opacity: 0; }
      /* A breath of glass over the screen. */
      .stage::after {
        content: "";
        position: absolute;
        top: 11px; right: 11px; bottom: 11px; left: 11px;
        border-radius: 5px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 38%);
        pointer-events: none;
      }
      .stage video {
        position: absolute;
        top: 11px; right: 11px; bottom: 11px; left: 11px;
        width: calc(100% - 22px);
        height: calc(100% - 22px);
        border-radius: 5px;
        display: block;
        background: #000;
        transition: opacity 0.45s ease;
      }

      /* Big quiet play affordance — only if autoplay is refused */
      .big-play {
        position: absolute;
        top: 11px; right: 11px; bottom: 11px; left: 11px;
        border-radius: 5px;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.25);
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .big-play.show { display: flex; }
      .big-play span {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.97), rgba(212, 216, 224, 0.92) 55%, rgba(158, 164, 175, 0.94));
        border: 1px solid rgba(0, 0, 0, 0.5);
        box-shadow:
          inset 0 1px 0 #ffffff,
          inset 0 -10px 16px rgba(0, 0, 0, 0.14),
          0 5px 16px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
      }
      .big-play:hover span { transform: scale(1.05); }
      .big-play svg { width: 34px; height: 34px; margin-left: 4px; fill: #1d1d1f; }

      .spinner {
        position: absolute;
        top: 11px; right: 11px; bottom: 11px; left: 11px;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .spinner.show { display: flex; }
      .spinner i, .stage-loading i {
        will-change: transform;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: rgba(255, 255, 255, 0.9);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner i, .stage-loading i { animation-duration: 2.4s; }
        .sheet { transition: none; }
        .stage { animation: none; }
        .stage video { transition: none; }
      }

      /* Stream-failure fallback — shown only when a stream truly fails */
      .stream-error {
        position: absolute;
        top: 11px; right: 11px; bottom: 11px; left: 11px;
        border-radius: 5px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #f5f5f7;
        text-align: center;
        padding: 24px;
      }
      .stream-error.show { display: flex; }
      .stream-error p { margin: 0; font-size: var(--fs-body); }
      .stream-error button {
        margin-top: 10px;
        color: var(--accent);
        background: none;
        border: 0;
        font-size: var(--fs-body);
        cursor: pointer;
        text-decoration: none;
        padding: 4px 8px;
      }

      .stage.gone { display: none; }
      /* Loading lives on the linen: a spinner, no frame, no black box. */
      .stage-loading {
        display: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        align-items: center;
        justify-content: center;
      }
      .stage-loading.show { display: flex; }

      /* Older Chrome (the A9's Marshmallow-era builds, anything
         before Chrome 88) has no aspect-ratio: without a height the
         stage collapses to nothing and the video inside it — sized
         from the stage — renders zero pixels tall. That is the
         "video does not play" on old browsers. The padding-top
         ratio box is the pre-aspect-ratio way to hold 16:9, and it
         works in every Chrome ever shipped; modern browsers never
         see this block. The absolutely positioned video and its
         overlays take their box from the stage's padding box, so
         they fill the ratio exactly as they do with aspect-ratio. */
      @supports not (aspect-ratio: 16 / 9) {
        .stage, .stage-loading { height: 0; padding-top: 56.25%; }
        .stage-loading { position: relative; }
        .stage-loading i {
          position: absolute;
          left: 50%;
          top: 50%;
          margin: -17px 0 0 -17px;
        }
      }

      /* ---------- Episode number and title, under the video ---------- */
      .episode-line {
        margin-top: 18px;
        padding: 0 8px;
        max-width: 640px;
        text-align: center;
      }
      .episode-line .ep-num {
        display: block;
        margin-bottom: 5px;
        font-size: var(--fs-micro);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .episode-line .ep-title {
        display: block;
        font-size: var(--fs-title);
        font-weight: 300;
        letter-spacing: -0.01em;
        line-height: 1.3;
        color: var(--text);
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
      }

      /* ---------- The Play button: glossy gel ---------- */
      /* The Library detail view's Play: the same glossy gel as the
         score switch's lit segment, pressed state and all. */
      .play-btn {
        margin-top: 20px;
        appearance: none;
        font-size: var(--fs-body);
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #ffffff;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.4);
        padding: 15px 54px;
        min-height: 56px;
        touch-action: manipulation;
        background: var(--gel);
        border: 1px solid #0b3d7d;
        border-radius: 10px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -1px 0 rgba(0, 0, 0, 0.18),
          0 1px 4px rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }
      .play-btn:hover { filter: brightness(1.06); }
      .play-btn:active {
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.16) 0%, rgba(0, 0, 0, 0.05) 48%, rgba(255, 255, 255, 0.02) 52%, rgba(0, 0, 0, 0.10) 100%),
          linear-gradient(180deg, #5ea5ef 0%, #256fc9 52%, #155cb4 100%);
        box-shadow:
          inset 0 2px 7px rgba(0, 0, 20, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.25),
          0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .play-btn:focus-visible, .quiet-btn:focus-visible, .sheet-done:focus-visible,
      .detail-back:focus-visible, .score-seg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- The score: one segmented control ---------- */
      /* iOS 6 segmented control: metal segments in a dark bezel,
         the chosen one lit with the same blue gel as the button. */
      .score-switch {
        display: flex;
        width: 100%;
        max-width: 340px;
        border: 1px solid rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .score-seg {
        flex: 1;
        appearance: none;
        font-size: var(--fs-control);
        font-weight: 500;
        color: #f0f0f2;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
        background: var(--gel-dark);
        border: 0;
        border-left: 1px solid rgba(0, 0, 0, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        cursor: pointer;
        padding: 7px 0;
      }
      .score-seg:first-child { border-left: 0; }
      .score-seg.selected {
        background: var(--gel);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -1px 0 rgba(0, 0, 0, 0.18);
      }

      /* Everything else: one tap away, whisper-quiet */
      .quiet-row {
        margin-top: 32px;
        margin-top: clamp(26px, 4.5vh, 40px);
        display: flex;
        align-items: center;
      }
      /* Flex gap is Chrome 84+; margins space the row everywhere. */
      .quiet-row > * + * { margin-left: 14px; }
      .quiet-btn {
        appearance: none;
        font-size: var(--fs-control);
        font-weight: 500;
        color: #f0f0f2;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
        background: var(--gel-dark);
        border: 1px solid rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 1px 2px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        padding: 10px 20px;
        min-height: 44px;
        touch-action: manipulation;
      }
      .quiet-btn:active {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.07);
      }
      /* ---------- Episodes sheet: linen, sliding up like an iPad sheet ---------- */
      .backdrop {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        background: var(--backdrop);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 20;
      }
      .backdrop.open { opacity: 1; pointer-events: auto; }

      .sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translate(-50%, 105%);
        width: 100%;
        max-width: 560px;
        max-height: 78vh;
        max-height: 78dvh;
        background-color: #34343a;
        background-image: var(--linen);
        border: 1px solid #0b0b0d;
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
        box-shadow: var(--sheet-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        z-index: 21;
        display: flex;
        flex-direction: column;
        transition: transform 0.45s cubic-bezier(0.32, 1.15, 0.35, 1);
      }
      .sheet.open { transform: translate(-50%, 0); }
      /* Brushed-metal toolbar across the top of the sheet. */
      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 10px 18px;
        background-color: #707076;
        background-image: var(--metal);
        border-bottom: 1px solid #1c1c1f;
        border-radius: 11px 11px 0 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -1px 0 rgba(255, 255, 255, 0.12);
      }
      .sheet-head h2 {
        margin: 0;
        font-size: var(--fs-title);
        font-weight: 500;
        letter-spacing: 0;
        color: #ffffff;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      .sheet-head-actions {
        display: flex;
        align-items: center;
      }
      .sheet-head-actions .sheet-done { margin-left: 8px; }
      .search-toggle {
        appearance: none;
        background: var(--gel-dark);
        border: 1px solid rgba(0, 0, 0, 0.6);
        border-radius: 7px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 1px 2px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        padding: 6px 10px;
        display: flex;
        align-items: center;
      }
      .search-toggle:active {
        box-shadow:
          inset 0 2px 5px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.15);
      }
      .search-toggle svg {
        width: 17px;
        height: 17px;
        fill: #f2f2f4;
        display: block;
        filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, 0.45));
      }
      .sheet-done {
        appearance: none;
        font-size: var(--fs-control);
        font-weight: 600;
        color: #ffffff;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.4);
        background: var(--gel);
        border: 1px solid #0b3d7d;
        border-radius: 7px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 1px 2px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        padding: 6px 14px;
      }
      .sheet-done:active {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 20, 0.45),
          0 1px 0 rgba(255, 255, 255, 0.15);
      }
      /* The official lockup lives here, in the Library header —
         small, centered, seen while browsing and nowhere else.
         It never touches the main screen or the video. */
      .sheet-logo {
        display: flex;
        justify-content: center;
        padding: 16px 20px 4px;
      }
      .sheet-logo img {
        display: block;
        width: 168px;
        max-width: 54%;
        height: auto;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5));
      }
      /* Search stays collapsed until it is asked for. */
      .sheet-search {
        display: none;
        padding: 8px 12px;
        background-image:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 3px),
          linear-gradient(180deg, #5d5d64, #4a4a51);
        border-bottom: 1px solid #1c1c1f;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }
      .sheet-search.open { display: block; }
      .sheet-search input {
        width: 100%;
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.4);
        outline: none;
        background: linear-gradient(180deg, #e9e9ec, #f7f7f8);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.32),
          0 1px 0 rgba(255, 255, 255, 0.25);
        color: #1d1d1f;
        font-size: var(--fs-body);
        padding: 8px 14px;
        border-radius: 15px;
      }
      .sheet-search input::placeholder { color: #7c7c82; }

      /* The score choice lives here now — set once, in the Library,
         not on the main screen. */
      .sheet-edition {
        display: flex;
        justify-content: center;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .sheet-list {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 0 14px;
        padding: 0 0 calc(14px + env(safe-area-inset-bottom));
      }
      /* Section bar, embossed into the linen. */
      .saga-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 7px 16px 6px;
        background: linear-gradient(180deg, rgba(148, 148, 158, 0.5), rgba(96, 96, 106, 0.5));
        border-top: 1px solid rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid rgba(0, 0, 0, 0.5);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        font-size: var(--fs-control);
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
      }
      .saga-group:first-child .saga-head { border-top: 0; }
      .saga-head .range {
        font-size: var(--fs-small);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.72);
        font-variant-numeric: tabular-nums;
      }
      .lib-empty {
        display: none;
        padding: 30px 20px 36px;
        text-align: center;
        font-size: var(--fs-body);
        color: var(--quiet);
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
      }
      .lib-empty.show { display: block; }
      .ep-row {
        display: flex;
        align-items: flex-start;
        width: 100%;
        appearance: none;
        background: none;
        border: 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
        color: var(--text);
        text-align: left;
        padding: 12px 16px;
        border-radius: 0;
        cursor: pointer;
        font-size: var(--fs-body);
      }
      .saga-group .ep-row:last-child { border-bottom: 0; box-shadow: none; }
      .ep-row:hover { background: rgba(255, 255, 255, 0.055); }
      .ep-row.current {
        background: linear-gradient(180deg, rgba(111, 177, 245, 0.30), rgba(38, 110, 205, 0.30));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .ep-row .num {
        width: 44px;
        flex: none;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }
      .ep-row .name { flex: 1; min-width: 0; margin-left: 12px; }
      .ep-row .ttl { display: block; }
      .ep-row .mark {
        flex: none;
        margin-left: 12px;
        font-size: var(--fs-small);
        color: var(--quiet);
        min-width: 18px;
        text-align: right;
        padding-top: 2px;
      }
      .ep-row .mark svg { width: 16px; height: 16px; fill: #8fc1f7; display: block; margin-left: auto; }
      .ep-row .mark .dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #8fc1f7;
      }

      /* ---------- Episode detail: one thing. The title. Big. ---------- */
      .sheet-detail {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 6px 26px 28px;
        padding: 6px 26px calc(28px + env(safe-area-inset-bottom));
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .sheet.detail-open .sheet-detail { display: flex; }
      .sheet.detail-open .sheet-head,
      .sheet.detail-open .sheet-logo,
      .sheet.detail-open .sheet-search,
      .sheet.detail-open .sheet-edition,
      .sheet.detail-open .sheet-list { display: none; }
      .detail-back {
        align-self: flex-start;
        appearance: none;
        font-size: var(--fs-control);
        font-weight: 600;
        color: #f0f0f2;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
        background: var(--gel-dark);
        border: 1px solid rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 1px 2px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        padding: 7px 14px 7px 10px;
        margin-top: 8px;
      }
      .detail-back:active {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .detail-title {
        margin: 30px 0 0;
        margin: clamp(18px, 5vh, 44px) 0 0;
        font-size: var(--fs-display);
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
        max-width: 520px;
        color: #ffffff;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .detail-play { margin-top: 28px; margin-top: clamp(22px, 4vh, 34px); }
      .detail-desc {
        margin: 18px 0 0;
        font-size: var(--fs-body);
        line-height: 1.7;
        color: #f7f7f9;
        text-align: left;
        max-width: 520px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(0, 0, 0, 0.45);
        border-radius: 8px;
        box-shadow:
          inset 0 1px 4px rgba(0, 0, 0, 0.4),
          0 1px 0 rgba(255, 255, 255, 0.06);
        padding: 20px 22px;
      }
      @media (max-width: 560px) {
        .play-btn { width: 100%; max-width: 340px; }
        .stage { border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage" id="stage">
        <video id="player" controls playsinline preload="auto"></video>

        <div class="spinner" id="spinner" aria-hidden="true"><i></i></div>

        <button class="big-play" id="bigPlay" aria-label="Play">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
          </span>
        </button>

        <div class="stream-error" id="streamError">
          <p id="streamErrorText">This episode didn&rsquo;t play.</p>
          <button id="retryBtn" type="button">Try Again</button>
        </div>
      </div>

      <div class="stage-loading" id="stageLoading" aria-hidden="true"><i></i></div>

      <div class="episode-line">
        <span class="ep-num" id="episodeNum"></span>
        <span class="ep-title" id="episodeTitle"></span>
      </div>

      <div class="quiet-row">
        <button class="quiet-btn" id="libraryBtn" type="button">Library</button>
      </div>
    </main>

    <div class="backdrop" id="backdrop"></div>

    <script type="application/json" id="epDescs">{"1": "Goku is a legendary warrior and the strongest fighter on the planet, but he's about to encounter a foe from out of this world. What brings this new menace to Earth? And what's up with his tail?", "2": "When Raditz abducts Gohan and announces his plans for Earth, Goku and Piccolo are forced into an uneasy alliance. The two rivals don't trust each other, but neither of them can stand against the Saiyan on their own.", "3": "Goku and Piccolo throw everything they have at Raditz, but the Saiyan's power dwarfs their best attacks. Piccolo has been saving a new technique for Goku — and this desperate battle is where he plans to use it.", "4": "Goku begins the treacherous trek down Snake Way in the Other World, hoping to reach King Kai and train for the Saiyans' arrival. Back on Earth, Gohan begins his own harsh tutelage under Piccolo.", "5": "Piccolo tries to toughen up Gohan with wilderness survival training, but things get hairy when the young Saiyan sees his first full moon. Meanwhile, Yajirobe summons Earth's strongest fighters to Kami's Lookout.", "6": "As the deadly Saiyan invaders approach Earth, Gohan makes slow but steady progress under the watchful eye of Piccolo, and Goku struggles with the gravity of his training under King Kai — starting with the King's bizarre test.", "7": "To prove himself worthy of King Kai's training, Goku must test his mettle against a fleet-footed monkey and a powerful cricket that's big on respect. Meanwhile, in the land of the living, Gohan takes a beating from his monstrous master.", "8": "Goku's training under King Kai is complete, and he's eager to return to Earth — but the trip home down Snake Way will take time he may not have. Earth's fighters must be ready to face the Saiyans without him.", "9": "The Saiyans have arrived, Goku isn't even on the planet, and the overmatched Z Fighters represent Earth's last line of defense. When Vegeta and Nappa unleash the gruesome Saibamen, Yamcha picks a fight that could be his last.", "10": "Krillin's furious attack clears the Saibamen from the field, but the Z Fighters are powerless against Nappa himself. One by one, Earth's defenders are pushed to their limits — and Goku's return is their only hope.", "11": "A three-hour pause in the battle counts down while Goku races toward Earth. When Vegeta senses an awesome source of power approaching, he orders Nappa to dispose of the remaining Z Fighters — starting with Gohan.", "12": "Goku arrives at the battlefield to find Gohan and Krillin in desperate shape, and the warrior fresh from King Kai's training is eager to put the hurt on Nappa. Watching closely, Prince Vegeta decides to size Goku up himself.", "13": "The stage is set for a showdown between Vegeta and Goku. The Saiyan Prince is stronger, faster, and far more ruthless — Goku's only hope is the Kaio-ken, a technique that may very well destroy the body that uses it.", "14": "Vegeta can't handle the fury of Goku's triple Kaio-ken, so the Saiyan warlord reaches for a Saiyan's most fearsome trick — one that needs a full moon he intends to supply himself. Goku's hopes turn to the mighty Spirit Bomb.", "15": "As Goku lies exhausted and vulnerable on the field of battle, Gohan and Krillin return to take aim at the giant Vegeta's one weakness: his tail. If they can take the ape out of the fight, they might escape with their lives.", "16": "Krillin takes charge of the Spirit Bomb energy Goku gathered, Gohan faces the giant Vegeta head-on, and an unlikely ally hidden nearby gets one clear shot. The Saiyan invasion reaches its endgame.", "17": "Vegeta's invasion is over, but there's no time to celebrate: the Z Fighters must find a way to bring back the friends they lost. Krillin has a plan — one that points to a distant planet called Namek.", "18": "Preparations for the journey to Namek hit a snag when the remaining Saiyan spaceship is lost. Mr. Popo may know of another vessel, so he and Bulma travel to the ends of the Earth for a closer look.", "19": "Bulma, Krillin and Gohan arrive on Namek after a month in space — and the Dragon Radar shows some balls already gathered. Vegeta is hunting the same prize, and so is Frieza, the emperor whose name makes whole planets tremble.", "20": "Gohan and Krillin tangle with Frieza's henchmen, but their spaceship is destroyed in the process. Vegeta is headed for a showdown with Cui, and the shrewd Saiyan is keeping his true power level under wraps.", "21": "Goku blasts off in a brand new spaceship specially equipped to help increase his strength on the way to Namek. On the planet, Krillin and Gohan watch in horror as Frieza's men terrorize Namekian villages for their Dragon Balls.", "22": "Gohan and Krillin risk their lives to rescue a young Namekian from the brute Dodoria. Their escape crosses paths with Vegeta, who has his own score to settle — and pressing questions about the destruction of his home planet.", "23": "Vegeta begins his violent search for the Dragon Balls, village by village. Meanwhile, Krillin and his new friend Dende set out to warn the Grand Elder of the horror headed his way.", "24": "King Kai telepathically phones Goku with a warning: stay as far away from Frieza as possible. Back on Namek, Vegeta tests himself against Zarbon, Frieza's elegant right hand — and discovers appearances in Frieza's army can be deceiving.", "25": "The Grand Elder unlocks the full force of Krillin's dormant power, so he can better protect his friends and their Dragon Ball. Elsewhere, a Saiyan-related premonition prompts Frieza to call for reinforcements.", "26": "Vegeta lays it on the line in a daring attempt to steal the Dragon Balls right out from under Frieza's nose. Krillin is riding high on a Namekian power surge, but he's about to wander into a dogfight he can't survive alone.", "27": "Intimidated by Vegeta's superior strength, Krillin reluctantly surrenders his precious Dragon Ball. A glimmer of hope remains after Gohan secures a ball of his own — if he can keep it hidden from Vegeta.", "28": "Vegeta intercepts Krillin and Gohan on their mad dash to the Grand Elder, but larger problems loom on the horizon: desperate times call for a truce, because the Ginyu Force has arrived on Namek.", "29": "Gohan and Krillin fight to survive against Guldo, a member of the Ginyu Force who possesses awesome psychic abilities. With Goku still in space and Vegeta their only ally, things look bleak for Earth's heroes.", "30": "Vegeta ramps his battle power up to impressive levels, but he's still no match for the Ginyu Force's grinning brute, Recoome. Meanwhile, Frieza discovers that simply gathering Namek's Dragon Balls isn't enough to use them.", "31": "At long last, Goku completes his journey from Earth and arrives on planet Namek. His friends are in grave shape, but the Saiyan warrior has a bag full of Senzu beans — and the results of a hundred days of gravity training.", "32": "As Frieza prepares for his ruthless interrogation of the Grand Elder, Goku shows off the benefits of training in gravity one hundred times that of Earth. Will it be enough to help him stand against Captain Ginyu?", "33": "Frieza locates the Grand Elder, but Nail intercepts the tyrant, risking his own life to preserve the Dragon Balls. Elsewhere, Gohan and Krillin rescue a damsel from some dinosaurs, and Goku continues his battle with Captain Ginyu.", "34": "Gohan and Krillin unearth the Dragon Balls, but summoning Namek's dragon is not as simple as Earth's. Later, Captain Ginyu's devious strategy forces Earth's warriors into an unthinkable position: turning their attacks toward Goku himself.", "35": "Goku is severely injured and unable to fight, so the race is on: a Namekian messenger rushes to help Gohan and Krillin summon Porunga, but there's no guarantee he'll arrive before Frieza.", "36": "Gohan and Krillin — with the aid of the young Namekian Dende — rush to make their wishes before Vegeta or Frieza discover their trickery. But Porunga's rules are not Shenron's rules, and every wish must be chosen with care.", "37": "Piccolo arrives on Namek, and an encounter with a fallen Namekian warrior presents him with a fateful choice. Meanwhile, Vegeta prepares to throw down with Frieza, but the Saiyan prince may be badly overmatched.", "38": "When Frieza turns his cruelty on Krillin, Gohan's fury erupts — the boy's hidden power has always surged when someone he loves is hurt. Dende's quiet gift becomes the group's lifeline as the battle spirals.", "39": "Piccolo joins the battle carrying the strength of two Namekian warriors, and the powerful villain is caught off guard. But Frieza has been treating every form as a restraint — and he has more of them.", "40": "Frieza has begun his ultimate transformation, and Vegeta pins his hopes on a ruthless Saiyan trait: growing stronger after recovering from a mortal wound. The plan hinges on convincing Dende to restore his strength.", "41": "Vegeta gives his increased power and speed a test run by launching a violent attack on Frieza, but no matter how furiously he fights, the Saiyan is unable to penetrate his enemy's defenses. Help, at last, is on its way.", "42": "Goku arrives at the battle scene to find Vegeta battered and badly beaten. The proud prince has things Goku needs to hear about Frieza — and about the Saiyans' past — before Goku faces the tyrant himself.", "43": "Goku and Frieza go head to head in a vicious slugfest that threatens to destroy the planet Namek. Krillin and Gohan are amazed by the brutality of the battle, but Piccolo believes both warriors are just warming up.", "44": "The bruises are multiplying as Goku and Frieza continue to pummel each other mercilessly — and Frieza admits he has been holding back far more than anyone guessed. Meanwhile, Bulma's encounter with an unusual frog leads to an out-of-body experience.", "45": "After suffering a savage beating at the hands of Frieza, Goku summons the awesome power of the Kaio-ken times twenty! If his desperate attack succeeds, victory will be his — but if it fails, the Saiyan race could be eliminated.", "46": "When his most powerful attacks fail to faze Frieza, Goku turns to his ultimate weapon: the Spirit Bomb, gathered from the energy of the living world. Piccolo joins the fight to buy Goku the time he needs.", "47": "With the help of his friends, Goku unleashes a gargantuan Spirit Bomb at Frieza. Victory seems assured — but the tyrant is not finished, and what he does next pushes Goku past a limit no Saiyan has crossed in a thousand years.", "48": "While Gohan races to Piccolo's side, Goku presses his astonishing new power against Frieza. The tyrant's response is a desperate counterattack that could obliterate Namek itself.", "49": "Despite the danger of Namek's impending destruction, Goku continues his battle with Frieza, determined to make the tyrant answer for everything he's done. Elsewhere, Gohan races to locate Bulma before it's too late.", "50": "Kami and King Kai concoct a plan involving the Dragon Balls of two worlds, and Goku continues his epic battle with the villainous Frieza — now fighting at his full, terrifying power.", "51": "Planet Namek is coming apart, a friend on Earth has a last-minute wish in mind, and Dende rushes to reach Porunga in time. On the battlefield, Gohan refuses to leave his father's fight unfinished.", "52": "Goku and Frieza continue their epic battle as planet Namek crumbles beneath their feet. Back on Earth, everyone eagerly awaits word of the fight's end — and of Goku's fate.", "53": "As the epic battle between the two warriors reaches its climax, planet Namek teeters on the brink of ultimate destruction, and Goku is faced with a choice about mercy in the middle of it.", "54": "Namek is gone, Frieza's reign of terror has been challenged like never before, and the whereabouts of Goku remain a mystery. How will Earth carry on? And what will become of the Namekian refugees?", "55": "The wreckage of Frieza is rebuilt with the help of the monster's fiendish father, King Cold! Together, they embark on a mission of vengeance against Earth. Will Goku return home in time to save his friends?", "56": "The bone-chilling onslaught of Frieza and King Cold is brought to a halt by a mysterious stranger with a mighty sword — but only time will tell if this new warrior is friend or foe!", "57": "The formidable stranger finally reveals the secret of his origins after a sparring session with Goku. The oddly familiar fighter is a visitor from the future, sent to deliver a grave warning.", "58": "Goku tells the amazing story of how he survived the destruction of Namek and learned a new technique along the way. Then the heroic warriors begin their training for a looming showdown with the Androids, three years from now.", "59": "Goku and his friends eagerly await the arrival of the Androids at the place and time Trunks predicted. But Yamcha's first confrontation with the mechanized monsters suggests Earth's heroes may be up against more than they can handle.", "60": "Goku tries to pulverize the Androids with a devastating display of his Super Saiyan strength, but a mysterious ailment prevents the mighty warrior from unleashing his true power!", "61": "Vegeta's sudden arrival creates an opening for the others to rescue Goku. While Yamcha rushes the fallen hero to safety, Vegeta reveals his new and improved fighting style — including the Big Bang Attack!", "62": "Goku wages a life-and-death battle with a deadly heart condition, Piccolo takes center stage in the fight against Android 20, and Trunks returns from the future with a disturbing revelation.", "63": "While Piccolo and company search for Dr. Gero's secret laboratory, Vegeta sets out to hunt down Android 20 himself. Meanwhile, Trunks tries everything in his power to save his stubborn father from his own pride.", "64": "The Z Fighters race to reach Dr. Gero's laboratory before he can activate Androids 17 and 18 — the very machines Trunks warned would bring the future to ruin.", "65": "Android 18 takes the fight to Vegeta, and the Saiyan prince's pride meets a power that simply does not tire. One by one, the Z Fighters face the unstoppable Androids — while a bedridden Goku remains their comrades' only hope.", "66": "Faced with an unbeatable enemy, Vegeta flies away in a solitary rage, and Piccolo seeks out Kami on a quest to increase his power by whatever means necessary.", "67": "While Kami considers Piccolo's request, Trunks and the others investigate a mystery Bulma has uncovered: a second time machine, abandoned and overgrown. Elsewhere, Vegeta vows to become strong enough to defeat the Android invaders.", "68": "During their investigation of the second time machine, Gohan and company stumble upon the shell of what appears to be a monstrous creature. And a horrific vision forces Kami to confront a decision he has avoided for years.", "69": "Piccolo finds himself face-to-face with the most terrifying monster the world has ever seen. Who is this new threat — and why does he have Goku's power?", "70": "Cell reveals the mysteries of his hideous origins to Piccolo, confident the Super Namekian is finished. Little does the monster know, Piccolo cannot be conquered so easily — and an escape plan is already in motion.", "71": "Cell continues his terrifying hunt across the cities, Krillin and Trunks deal with what remains of Dr. Gero's laboratory, and Goku awakens from his extended slumber ready to fight!", "72": "Goku leads his Saiyan brethren to a secret room designed for highly advanced training — the Room of Spirit and Time. Meanwhile, Piccolo puts his enhanced powers to the test against an Android adversary.", "73": "Piccolo and Android 17 trade blows in a battle of unprecedented brutality! Cell — sensing their presence — races to the scene of the skirmish in pursuit of his terrifying perfect form.", "74": "Cell's arrival forces Piccolo into a desperate, final stand to keep Android 17 out of the monster's reach. While he fights, Goku and Gohan wait for Vegeta to emerge from the Room of Spirit and Time.", "75": "Cell turns his attention to his true prey: Androids 17 and 18, whom he must absorb to achieve his perfect form. But the silent warrior Android 16 has decided to stand in his way.", "76": "Desperate to help Android 18 escape, Tien places his own life at risk in an unwinnable battle with the monster Cell, pouring everything into one technique to hold the creature back.", "77": "Vegeta puts his new powers to the test in a shocking slugfest with Cell. Back in the Room of Spirit and Time, Goku attempts to teach Gohan the secret to a Super Saiyan transformation.", "78": "Vegeta is fighting Cell — can he finish the monster before it reaches Android 18? And with the emergency shutdown controller in hand, can Krillin bring himself to use it on her?", "79": "As Cell closes in on Android 18, Vegeta's pride becomes the monster's greatest weapon. Krillin attempts to get Androids 16 and 18 to safety before the situation takes a turn for the worst.", "80": "The tables have turned: Cell, in his perfect form, finally goes into action. Krillin and Vegeta test themselves against him as Trunks prepares to reveal his true power — and Goku and Gohan continue training in the Room of Spirit and Time.", "81": "Vegeta unleashes an awesome all-or-nothing attack, but Perfect Cell's terror grows and grows. With the Saiyan prince pushed to his limit, the way clears for Trunks to enter the fight.", "82": "Goku and Gohan continue their Super Saiyan training, and Trunks finds out the hard way that boosting his power to the next level may not stop Cell. The situation looks bleak — until the monster throws down a challenge instead.", "83": "Cell hijacks the airwaves to announce a tournament: the Cell Games, where Earth's fate will be decided. Trunks informs the Z Fighters of the plan, and Android 16 is taken to Capsule Corporation to be repaired.", "84": "Goku and Gohan complete their training in the Room of Spirit and Time and fly down from the Lookout to greet their friends — relaxed, fed, and quietly confident about the Cell Games ahead.", "85": "Piccolo and Vegeta take their turns training in the Room of Spirit and Time, while Goku and Gohan enjoy a rare, quiet rest at home. Not everyone is content to wait for the Cell Games, though — Earth's military has plans of its own.", "86": "In an attempt to revive the Dragon Balls, Goku tries to find the new planet where the Namekians are residing, with the help of King Kai — and to bring back a guardian for Earth.", "87": "The tournament is about to begin, and a hulking human with a devilish name is slated to be the first challenger! Can the arrogant champion Mr. Satan make good on his boasts, or will Cell teach him the meaning of the word pain?", "88": "Goku and Cell prepare to square off in what may be the greatest battle in history! Both fighters are hesitant to reveal their true powers, but once blows are exchanged, the violence quickly escalates.", "89": "Goku and Cell put on an amazing display of ferocious fighting! The monster makes things more interesting by blowing up the ring, and Goku responds with a devastating Kamehameha.", "90": "Goku and Cell battle until both warriors are winded and weary. With the fate of the world hanging in the balance, Goku makes a decision nobody saw coming.", "91": "Gohan replaces his father in the battle with Cell, but the boy appears to be no match for his monstrous opponent. His only hope is to unleash the fury lurking deep inside him — the power everyone has glimpsed since he was small.", "92": "Android 16 tries to take the bad guy out with a bang, Cell summons his miniature minions, the Cell Juniors, and a cowardly champion risks his life to deliver an important message to Gohan.", "93": "Gohan's rage boils over as he races to rescue his friends from the brink! Next, the boy gives his new powers a whirl in a bone-crushing battle with the menacing Cell Juniors.", "94": "Cell reveals the full force of his true power, but Gohan refuses to flinch in the face of danger. As the momentum swings, Goku calls for his son to finish it — if the boy's heart will let him.", "95": "Cell has one last trick up his sleeve — a devastating development that could destroy the world. For the sake of the future, Goku must prepare himself for the ultimate sacrifice.", "96": "Cell returns with intentions to wipe out planet Earth once and for all! Gohan is badly injured, but with a little help from his friends — and a pep talk from his father — he summons a Kamehameha that just might save the world.", "97": "In the aftermath of battle, Dende heals the injured heroes and summons the Dragon Balls in an attempt to bring back those lost during Cell's rampage — and to ask what cannot usually be asked.", "98": "Trunks returns to the future to reunite with his mother, carrying newfound strength — and unfinished business with the Androids who ruined his world.", "99": "Seven years after the battle with Cell, Gohan is now a high school student attending Orange Star High School — and trying, not always successfully, to live like an ordinary teenager.", "100": "Gohan creates an alias called the Great Saiyaman, allowing him to stop criminals while also concealing his true identity. Keeping that secret at a new school may be harder than any fight.", "101": "Gohan's heroics keep drawing attention — including a plane rescue and a city fire — while Videl, Satan City's own crime-fighter, chases the Great Saiyaman in her helicopter, determined to find out who is under the mask.", "102": "When a young pterodactyl named Chobi is captured by a circus, Gohan's rescue attempt is mistaken for a crime — and Videl is closing in on the Great Saiyaman's secret from both sides.", "103": "Word of the World Martial Arts Tournament spreads among the Z Fighters, and Gohan begins training with his little brother Goten — whose explosive power holds a surprise or two, even for a Super Saiyan's son.", "104": "Gohan teaches Videl the basics of learning to control her energy — the first step toward flight, and a lesson that requires more patience than power.", "105": "On the day of the tournament, Goku is allowed to return to Earth for a 24-hour visit, granted by Fortune Teller Baba. The whole Dragon Team assembles for the first time in seven years.", "106": "The preliminary rounds begin, and the combatants must hit a punching machine to rank their strength — a poor match for fighters who have battled Androids and Cell. Afterwards, everyone settles in to watch the juniors division.", "107": "Goku, Vegeta and the others spectate at the tournament while Gohan and Videl wait to take their preliminary test. In the juniors division, Goten and Trunks' battle has the whole stadium talking.", "108": "The juniors division reaches its final: Goten versus Trunks, best friends and rivals, with the winner set to face Mr. Satan himself in an exhibition match.", "109": "During an intermission, as Goku and the others get something to eat, they are encountered by two mysterious participants whose presence sets Piccolo and the others on edge.", "110": "Piccolo goes up against the mysterious being called Shin in the first round — and something about his opponent makes the former Demon King deeply uneasy.", "111": "Videl faces Spopovitch, a hulking fighter who competed years ago and barely lasted seconds — but something has changed in him, and Goku and the others can sense that Videl's match is not what it seems.", "112": "After Videl's brutal match with Spopovitch, Gohan's fury reaches its limit — and his own first-round match, against the mysterious Kibito, is about to begin.", "113": "Gohan rushes a Senzu bean to the infirmary, then steps into the ring to face Kibito, who is oddly eager to see Gohan's full power on display. The Supreme Kai asks the others not to intervene — whatever happens next.", "114": "Goku and the others arrive at the site of a buried spaceship and watch as Spopovitch and Yamu deliver stolen energy to the evil wizard Babidi and his partner, Dabura, King of the Demon Realm.", "115": "Goku, Vegeta, Gohan and the Supreme Kai chase after Dabura into the spaceship, where they are confronted by one of Babidi's minions, Pui Pui — the first of the wizard's staged defenses.", "116": "Babidi's ship is a gauntlet of warriors from across the galaxy, each guarding a floor. After Vegeta's turn against Pui Pui, Goku prepares to fight the light-devouring monster Yakon.", "117": "Dabura prepares to fight the Saiyans himself. Meanwhile, back at the tournament, a battle royal is held between the remaining contestants to decide the World's Greatest.", "118": "Android 18 continues fighting the mysterious Mighty Mask, whose strength and strange movements hide more than a costume should.", "119": "Android 18 weighs a deal involving Mr. Satan and the prize money. Meanwhile, inside Babidi's ship, Gohan takes his turn against Dabura.", "120": "As the battle between Dabura and Gohan continues, Babidi plots to sway Vegeta to his side using magic — probing for the evil the Saiyan prince still carries in his heart.", "121": "Babidi's magic sets the stage for the fight seven years in the making: Goku versus Vegeta, with nothing held back and the wizard's plans ticking away beneath them.", "122": "While the fight between Goku and Vegeta intensifies, Gohan and the Supreme Kai attempt to stop Majin Buu from being revived — racing the energy the duel above keeps pouring in.", "123": "As the fight between Goku and Vegeta escalates, Gohan attempts to stop Majin Buu's egg from reaching full power, with the Supreme Kai's hopes pinned on a single, desperate stand.", "124": "Majin Buu — the terror the Supreme Kai has dreaded for millions of years — is loose. Gohan and the Supreme Kai face a foe whose power defies everything they have felt before.", "125": "Majin Buu's bizarre powers turn everything — even Dabura's defiance — into a game, and his hunger makes him as unpredictable as he is strong. Fearing Buu cannot be controlled, everyone around him recalculates.", "126": "Vegeta goes to deal with the Majin himself, and is shocked by Buu's regenerative abilities — a monster that treats mortal wounds as a joke.", "127": "For the sake of the people he loves, Vegeta prepares a final, mortal combat against Majin Buu — the proud warrior's most desperate stand.", "128": "Word of Vegeta's stand spreads, and Goku faces the reality that Majin Buu remains at large. Meanwhile, a weakened Supreme Kai searches for Gohan, whose fate is still unknown.", "129": "Understanding that no one can defeat Majin Buu as they are, Goku pins the future on Goten and Trunks — and a technique called Fusion.", "130": "The Supreme Kai and Kibito finally find Gohan. Meanwhile, Babidi makes a worldwide announcement, putting every city on Earth on notice while the remaining warriors gather themselves.", "131": "The Supreme Kai reveals his plan to have Gohan master the legendary Z Sword in order to defeat Majin Buu. Meanwhile, Goku teaches the Fusion technique to Goten and Trunks.", "132": "As Majin Buu lays waste to another city, Goten and Trunks contact Babidi and inform him that they will soon be strong enough to fight Buu. Their Fusion training continues — poses, timing, and all.", "133": "Babidi and Majin Buu plan to destroy West City, so Goku confronts them, hoping to buy some time. Meanwhile, Trunks is on a mission to retrieve the Dragon Radar from West City before Buu gets there.", "134": "Goku's stalling tactic becomes a showcase: against Majin Buu, he unveils a level of Super Saiyan never seen before — knowing every second of it costs him time on Earth.", "135": "With his time on Earth running short, Goku wastes none of it, teaching Goten and Trunks the final key component to mastering the Fusion technique: the pose, performed in perfect sync.", "136": "Goku returns to the Other World, leaving Piccolo to continue training Goten and Trunks — and Earth to face Majin Buu with its youngest warriors.", "137": "Goku arrives in the Sacred World of the Kais, where Gohan has been training with the Z Sword — and the Kais are watching the young warrior's progress with great interest.", "138": "Finally mastering the Fusion Dance, Gotenks sets out in search of Majin Buu, despite Piccolo's protests. Meanwhile, the Elder Kai reveals he has the ability to unlock a warrior's true potential.", "139": "Gotenks arrives to fight Majin Buu — brimming with the confidence only a fused kid could have, and with Piccolo watching the clock on the Fusion's time limit.", "140": "The Elder Kai begins the long process of unlocking Gohan's true potential. Meanwhile, an unexpected friendship softens Majin Buu's rampage, and Gotenks practices becoming a Super Saiyan.", "141": "An act of cruelty in front of Majin Buu sparks something no one expected: the evil inside Buu given form of its own. What anger gives rise to may be worse than the Majin himself.", "142": "Majin Buu attempts to fight against the Evil Buu — a leaner, colder version of himself, revealed to be much more powerful. Two Buus enter the wasteland; the world's fate hangs on which one remains.", "143": "Piccolo tries to buy some time after the new Super Buu unleashes a devastating attack on the Earth. With Gohan's ritual unfinished and Fusion on a timer, every minute is precious.", "144": "Hoping to avenge their loved ones, Gotenks fights Super Buu in the Room of Spirit and Time — a battlefield sealed away from the world, with Piccolo making sure it stays that way.", "145": "Gotenks and Super Buu continue to fight, with Gotenks unleashing his special move called the Super Ghost Kamikaze Attack — an army of explosive ghosts with minds of their own.", "146": "Super Buu manages to escape the Room of Spirit and Time, causing Gotenks to finally unleash his trump card — and Piccolo to face the monster on the Lookout.", "147": "Gotenks and Super Buu continue their battle — with the fused warrior's flair for the dramatic turning the fight into a very unusual game of volleyball.", "148": "As the fight turns against a weakened Gotenks, a familiar presence approaches the battlefield: Gohan, returning to Earth at last, with the Elder Kai's ritual complete.", "149": "With newfound powers unlocked by the Elder Kai, Gohan fights Super Buu — no transformations, no holding back, just the full depth of the strength that was always inside him.", "150": "Super Buu, outmatched, devises a sinister plan to gain the upper hand against Gohan — and it begins with challenging Gotenks to a rematch.", "151": "Super Buu's plan unfolds, and the battle against Gohan takes a sudden turn. In the Sacred World of the Kais, the Elder Kai proposes a brainstorm: a way to bring Goku back to the fight.", "152": "Desperate to match Super Buu's power, Goku must convince Vegeta to fuse with him using the Potara earrings — a combination with no time limit, and no undoing.", "153": "The ultimate fusion of Goku and Vegeta, Vegito, fights Super Buu — with a confidence that borders on toying with the most dangerous being in the universe.", "154": "Vegito continues to fight Super Buu, who is clearly outmatched by the fused warrior. But Buu has one ace in the hole left, and Vegito seems almost to be waiting for it.", "155": "Super Buu absorbs Vegito — who had planned for the turn of events in order to save his friends and family. Inside the monster's body, a rescue mission begins.", "156": "Still inside Buu's body, Goku and Vegeta fight the beings manifesting from Buu's mind as they search for everyone the monster has taken.", "157": "Vegeta and Goku race to get their friends and family out of Buu's body — but freeing one particular prisoner threatens to change Buu into something older, and far less predictable.", "158": "The final showdown moves to the Sacred World of the Kais, where Goku faces the original Majin Buu — pure, ancient, and without a trace of mercy or reason.", "159": "Goku powers up to Super Saiyan 3 in an attempt to destroy Buu once and for all — a form that drains a living body far faster than it ever drained a dead one.", "160": "Vegeta steps in to fight Buu himself, buying an exhausted Goku the one minute he needs to regather his power — a stall for time with his life as the price of every second.", "161": "An inspired strategy comes together in a flash: two wishes on the Namekian Dragon Balls, a restored Earth, and one last plan that will need the help of every living soul.", "162": "Goku begins creating the Spirit Bomb in a final attempt to destroy Buu — but this time the energy must be offered freely by the people of Earth, and they do not know his voice.", "163": "Vegeta attempts to convince the people of Earth to give their energy for the Spirit Bomb, while Buu's assault forces him back into a fight he can barely stand through.", "164": "Goku struggles to destroy Buu, who pushes back against the Spirit Bomb with everything he has. The fate of the universe comes down to one throw — and the strength left in a single pair of hands.", "165": "Peace returns, and the warriors rest: Bulma invites the Z Fighters and friends to a barbecue at Capsule Corp, and even Goku's late arrival — held up by hatching dinosaur eggs in the mountains — is welcomed by his loved ones.", "166": "It has been ten years since Buu. Goku, Goten, Vegeta and Trunks enter the World Martial Arts Tournament, where they also meet up with old friends and family — and one mysterious young entrant.", "167": "The World Martial Arts Tournament begins, and Goku battles the mysterious fighter called Uub — a match Goku has waited ten years for, and the start of a brand-new journey."}</script>

           are always tappable. If even that takes more than a few
           seconds, the stage appears anyway: a visible player the
           viewer can tap beats a spinner on the linen, always. */
        function clearReveal() {
          if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
        }
        function armReveal(seq) {
          clearReveal();
          revealTimer = setTimeout(function () {
            revealTimer = null;
            if (seq !== loadSeq || errorShown) return;
            hasFrame = true;
            applyStageVisibility();
          }, 4000);
        }
        function revealStage() {
          clearReveal();
          if (!hasFrame) { hasFrame = true; applyStageVisibility(); }
        }

        /* One handler for every fresh load — the episode itself and
           its fallback retry alike: when the metadata lands, seek
           to the saved moment and play. Fires once, then removes
           itself. */
        function metadataHandler(pos) {
          var done = false;
          function onMeta() {
            video.removeEventListener('loadedmetadata', onMeta);
            if (pendingMetaHandler === onMeta) pendingMetaHandler = null;
            if (done) return;
            done = true;
            metaArrived = true;
            revealStage();
            if (pos > 5 && video.duration && pos < video.duration - 20) {
              try { video.currentTime = pos; } catch (e) {}
            }
            tryPlay();
          }
          return onMeta;
        }

        /* ----- loading an episode ----- */
        function loadEpisode(n, opts) {
          opts = opts || {};
          var startAt = typeof opts.at === 'number' ? opts.at : (opts.fromStart ? 0 : savedPos(n));
          /* If the preloader already holds this episode and actually
             buffered a frame, it becomes the player (see
             promotePreloader) and its data is reused — never
             re-fetched. A preloader holding only metadata (common
             on iOS) would strand the stage on a black frame, so
             anything else loads cold on the stage player. */
          var useWarm = preloadedEp === n && preloader !== video &&
            !preloader.error && preloader.src === epUrl(n) &&
            preloader.readyState >= 2;
          current = n;
          store.ep = n;
          fallbackUsed = false;
          hasFrame = false;
          metaArrived = false;
          errorShown = false;
          stage.classList.add('switching');
          streamError.classList.remove('show');
          bigPlay.classList.remove('show');
          spinner.classList.add('show');

          pendingStartAt = startAt;
          wantPlay = false;
          lastSeenTime = startAt;
          lastProgressAt = Date.now();
          stallRecoveries = 0;
          clearPendingMeta();
          armStall(++loadSeq);
          armReveal(loadSeq);

          var onMeta = metadataHandler(startAt);

          if (useWarm) {
            promotePreloader();
            if (video.readyState >= 2) hasFrame = true;
            if (video.readyState >= 1) onMeta();
            else setPendingMeta(onMeta);
          } else {
            /* If the preloader holds this same episode without a
               usable frame, stop it — two downloads of one file
               only starve each other. */
            if (preloadedEp === n) {
              clearPreloader(preloader);
              preloadedEp = 0;
              warmedFor = 0;
            }
            video.src = epUrl(n);
            video.load();
            setPendingMeta(onMeta);
          }
          applyStageVisibility();

          renderEpisodeLine();
          save();
          if (castSession) castLoad(n, startAt);
        }

        /* The warm-up becomes the player: the preloaded element moves
           into the stage with its buffered data intact — no new src,
           no load(), no cold metadata wait. It gains controls and
           sound; the old player is emptied, hidden, and recycled as
           the fresh preloader, which warmNext then fills with the
           following episode. */
        function promotePreloader() {
          var old = video;
          var next = preloader;
          unbindPlayer(old);
          try { old.pause(); } catch (e) {}
          inPip = false;
          next.id = 'player';
          next.removeAttribute('style');
          next.removeAttribute('muted');
          next.muted = false;
          next.setAttribute('controls', '');
          old.id = 'preloader';
          old.removeAttribute('controls');
          old.setAttribute('muted', '');
          old.muted = true;
          old.style.display = 'none';
          stage.replaceChild(next, old);
          document.body.appendChild(old);
          clearPreloader(old);
          video = next;
          preloader = old;
          preloadedEp = 0;
          warmedFor = 0;
          bindPlayer(video);
        }

        function tryPlay() {
          wantPlay = true;
          lastProgressAt = Date.now();
          var p = video.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function () {
              /* Autoplay refused: the episode is waiting for a tap,
                 not stalled — stand the watchdogs down and make sure
                 the Play button is on screen to be tapped. */
              wantPlay = false;
              clearStall();
              revealStage();
              bigPlay.classList.add('show');
            });
          } else {
            /* Older Chrome: play() returns nothing at all, and a
               refused autoplay is silent — no rejection to catch,
               no error event. If the episode still hasn't started
               a moment later, it is waiting for a tap: stand the
               watchdogs down and put the big Play on screen, the
               same end state the promise path reaches. If it did
               start, 'playing' has already taken care of the UI. */
            var seqAtCall = loadSeq;
            setTimeout(function () {
              if (seqAtCall !== loadSeq || errorShown) return;
              if (!video.paused || video.ended || !video.src) return;
              wantPlay = false;
              clearStall();
              revealStage();
              bigPlay.classList.add('show');
            }, 900);
          }
        }

        bigPlay.addEventListener('click', function () {
          bigPlay.classList.remove('show');
          tryPlay();
        });

        function onPlayerPlaying() {
          clearStall();
          wantPlay = true;
          lastProgressAt = Date.now();
          try { lastSeenTime = video.currentTime || 0; } catch (e) {}
          spinner.classList.remove('show');
          bigPlay.classList.remove('show');
          stage.classList.remove('switching');
          warmNext();
        }
        function onPlayerWaiting() {
          spinner.classList.add('show');
          /* The episode on screen needs every bit of bandwidth
             right now — the next episode's warm-up stands down. */
          suspendPreloader();
        }
        function onPlayerCanplay() {
          clearStall();
          clearReveal();
          spinner.classList.remove('show');
          stage.classList.remove('switching');
          if (!hasFrame) { hasFrame = true; applyStageVisibility(); }
        }

        /* Picture-in-picture is the system's, and it stays. But while
           the video is floating, the empty stage here collapses —
           the button only — and comes back when PiP ends.
           Safari reports this on the element itself, not with the
           standard events, so both are listened for. */
        function onEnterPip() {
          inPip = true;
          applyStageVisibility();
        }
        function onLeavePip() {
          inPip = false;
          applyStageVisibility();
        }
        function onPresModeChanged() {
          inPip = video.webkitPresentationMode === 'picture-in-picture';
          applyStageVisibility();
        }
        function onPlayerPause() { wantPlay = false; savePosition(); }
        function onPlayerPlay() { wantPlay = true; lastProgressAt = Date.now(); }
        /* No raw error, no dead end: one plain sentence stating
           the fact, and one action — Try Again — on this screen. */
        function showStreamError() {
          spinner.classList.remove('show');
          errorShown = true;
          wantPlay = false;
          stage.classList.remove('switching');
          applyStageVisibility();
          document.getElementById('streamErrorText').textContent =
            navigator.onLine === false
              ? 'You\u2019re offline. Reconnect, then try Episode ' + current + ' again.'
              : 'Episode ' + current + ' didn\u2019t play.';
          streamError.classList.add('show');
        }

        function onPlayerError() {
          clearStall();
          clearReveal();
          if (video.src && !fallbackUsed) {
            /* The fast direct host didn't answer. Retry once through
               the normal archive.org/download link — same file,
               different door — before showing the error notice. */
            fallbackUsed = true;
            metaArrived = false;
            spinner.classList.add('show');
            var resumeAt = pendingStartAt || 0;
            try { if (video.currentTime) resumeAt = video.currentTime; } catch (e) {}
            pendingStartAt = resumeAt;
            video.src = epFallbackUrl(current);
            video.load();
            setPendingMeta(metadataHandler(resumeAt));
            lastProgressAt = Date.now();
            armStall(loadSeq); /* the fallback gets a watchdog too */
            armReveal(loadSeq);
            return;
          }
          if (video.src) showStreamError();
        }

        /* ----- playback-stall recovery -----
           The load watchdog dies with the metadata; until now,
           nothing watched the episode itself. A stream that stalls
           mid-episode — archive.org throttling, a dropped range
           request, a weak signal — sat on a frozen frame and a
           spinner forever, because 'waiting' had no way out.
           Now: while playback is wanted and the episode's clock
           has not advanced for fifteen seconds, reload the stream
           at the same moment through the other door (direct host
           and archive.org/download take turns). Three recoveries
           that still buy no progress end at the error panel —
           never at an endless freeze. A deliberate pause, a seek,
           a background tab, Picture-in-Picture, and the big Play
           waiting for a tap are not stalls and are never touched. */
        function recoverFromStall() {
          stallRecoveries++;
          lastRecoveryAt = Date.now();
          lastProgressAt = Date.now();
          suspendPreloader();
          var resumeAt = pendingStartAt || 0;
          try { resumeAt = video.currentTime || resumeAt; } catch (e) {}
          pendingStartAt = resumeAt;
          lastSeenTime = resumeAt;
          fallbackUsed = !fallbackUsed;
          metaArrived = false;
          errorShown = false;
          streamError.classList.remove('show');
          spinner.classList.add('show');
          video.src = fallbackUsed ? epFallbackUrl(current) : epUrl(current);
          video.load();
          setPendingMeta(metadataHandler(resumeAt));
          armStall(loadSeq);
          armReveal(loadSeq);
        }

        setInterval(function () {
          if (!wantPlay || errorShown || inPip) return;
          if (document.hidden) { lastProgressAt = Date.now(); return; }
          if (bigPlay.classList.contains('show')) return;
          if (video.ended || video.seeking || !video.src) return;
          var t = 0;
          try { t = video.currentTime || 0; } catch (e) { return; }
          if (Math.abs(t - lastSeenTime) > 0.1) {
            lastSeenTime = t;
            lastProgressAt = Date.now();
            /* Half a minute of honest progress forgives the
               recoveries spent getting here. */
            if (stallRecoveries && Date.now() - lastRecoveryAt > 30000) stallRecoveries = 0;
            return;
          }

          if (stallRecoveries >= 3) { showStreamError(); return; }
          recoverFromStall();

          streamError.classList.remove('show');
          loadEpisode(current);
        });

        function recordPos() {
          if (!video.duration || isNaN(video.duration)) return;
          var t = video.currentTime || 0;
          if (t > 5 && t < video.duration - 15) {
            store.pos[current] = t;
          } else if (t >= video.duration - 15) {
            delete store.pos[current];
          }
        }
        function savePosition() { recordPos(); save(); }
        /* The position is written while the episode plays, at most
           two seconds stale — so a killed app, a crash, or a dead
           battery resumes at the same moment, not near it. The user
           never sees this code; they feel it the one night it matters. */
        var lastRecordedAt = -99;
        function onPlayerTimeupdate() {
          var t = video.currentTime || 0;
          if (Math.abs(t - lastRecordedAt) < 2) return;
          lastRecordedAt = t;
          recordPos();
          save();
        }

        function onPlayerEnded() {
          store.done[current] = true;
          delete store.pos[current];
          save();
          if (current < TOTAL) {
            setTimeout(function () { loadEpisode(current + 1, { fromStart: true }); }, 1200);
          }
        }

        /* The handlers above are named so they can move with the
           job: promotePreloader unbinds them from the old element
           and binds them to the promoted one, so PiP collapse,
           progress saving, the fallback retry, and auto-advance
           all follow the swap. */
        function bindPlayer(el) {
          el.addEventListener('playing', onPlayerPlaying);
          el.addEventListener('play', onPlayerPlay);
          el.addEventListener('waiting', onPlayerWaiting);
          el.addEventListener('stalled', onPlayerWaiting);
          el.addEventListener('canplay', onPlayerCanplay);
          el.addEventListener('enterpictureinpicture', onEnterPip);
          el.addEventListener('leavepictureinpicture', onLeavePip);
          el.addEventListener('webkitpresentationmodechanged', onPresModeChanged);
          el.addEventListener('pause', onPlayerPause);
          el.addEventListener('error', onPlayerError, true);
          el.addEventListener('timeupdate', onPlayerTimeupdate);
          el.addEventListener('ended', onPlayerEnded);
        }
        function unbindPlayer(el) {
          el.removeEventListener('playing', onPlayerPlaying);
          el.removeEventListener('play', onPlayerPlay);
          el.removeEventListener('waiting', onPlayerWaiting);
          el.removeEventListener('stalled', onPlayerWaiting);
          el.removeEventListener('canplay', onPlayerCanplay);
          el.removeEventListener('enterpictureinpicture', onEnterPip);
          el.removeEventListener('leavepictureinpicture', onLeavePip);
          el.removeEventListener('webkitpresentationmodechanged', onPresModeChanged);
          el.removeEventListener('pause', onPlayerPause);
          el.removeEventListener('error', onPlayerError, true);
          el.removeEventListener('timeupdate', onPlayerTimeupdate);
          el.removeEventListener('ended', onPlayerEnded);

        /* ----- the score: Original or Faulconer -----
           One quiet segmented control in the Library — a choice made
           once, so it does not live on the main screen. Switching
           reloads the same episode from the other edition at the
           same moment — the cuts are identical, only the music
           differs — and the choice is remembered on this device.
           The warm-up retires with the switch: it holds the other
           edition's file, so the next episode warms up fresh. */
        var scoreOriginalBtn = document.getElementById('scoreOriginal');
        var scoreFaulconerBtn = document.getElementById('scoreFaulconer');

          var at = 0;
          try { at = video.currentTime || 0; } catch (e) {}

          store.edition = next;
