        var _descs = null;
        function getDesc(n) {
          if (!_descs) {
            try { _descs = JSON.parse(document.getElementById('epDescs').textContent); }
            catch (e) { _descs = {}; }
          }
          return _descs[n] || '';
        }

        var SAGAS = [
          { name: 'Saiyan', from: 1, to: 18 },
          { name: 'Frieza', from: 19, to: 54 },
          { name: 'Androids and Cell', from: 55, to: 82 },
          { name: 'Cell Games', from: 83, to: 98 },
          { name: 'World Tournament', from: 99, to: 122 },
          { name: 'Majin Buu', from: 123, to: 140 },
          { name: 'Evil Buu', from: 141, to: 167 }
        ];
        var libSearch = document.getElementById('libSearch');
        var sheetSearch = document.getElementById('sheetSearch');
        var libEmpty = document.getElementById('libEmpty');
        var sheetBuilt = false;

        function buildSheet() {
          if (sheetBuilt) return;
          sheetBuilt = true;
          SAGAS.forEach(function (saga) {
            var group = document.createElement('div');
            group.className = 'saga-group';
            group.setAttribute('data-saga', saga.name.toLowerCase());

            var head = document.createElement('div');
            head.className = 'saga-head';
            var hName = document.createElement('span');
            hName.textContent = saga.name + ' Saga';
            var hRange = document.createElement('span');
            hRange.className = 'range';
            hRange.textContent = saga.from + ' \u2013 ' + saga.to;
            head.appendChild(hName);
            head.appendChild(hRange);
            group.appendChild(head);

            for (var n = saga.from; n <= saga.to; n++) {
              (function (n) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'ep-row';
                b.setAttribute('data-ep', n);
                var num = document.createElement('span');
                num.className = 'num';
                num.textContent = n;
                var name = document.createElement('span');
                name.className = 'name';
                var ttl = document.createElement('span');
                ttl.className = 'ttl';
                ttl.textContent = EP_TITLES[n] ? EP_TITLES[n] : 'Episode ' + n;
                name.appendChild(ttl);
                var mark = document.createElement('span');
                mark.className = 'mark';
                b.appendChild(num);
                b.appendChild(name);
                b.appendChild(mark);
                b.addEventListener('click', function () { openDetail(n); });
                group.appendChild(b);
              })(n);
            }
            sheetList.insertBefore(group, libEmpty);
          });
        }

        function refreshSheet() {
          var rows = sheetList.querySelectorAll('.ep-row');
          for (var i = 0; i < rows.length; i++) {
            var n = parseInt(rows[i].getAttribute('data-ep'), 10);
            setClass(rows[i], 'current', n === current);
            var mark = rows[i].querySelector('.mark');
            mark.innerHTML = '';
            if (isDone(n)) {
              mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 16.6 4.8 12.2l-1.5 1.5 5.9 5.9L20.7 8.1l-1.5-1.4z"/></svg>';
            } else if (savedPos(n) > 30) {
              mark.innerHTML = '<span class="dot" aria-hidden="true"></span>';
            }
          }
        }

        /* ----- tap an episode: the title, big, with its description
                 right there under it. Nothing to ask for. ----- */
        var detailEp = null;
        var detailTitle = document.getElementById('detailTitle');
        var detailPlay = document.getElementById('detailPlay');
        var detailDesc = document.getElementById('detailDesc');

        function openDetail(n) {
          detailEp = n;
          var d = getDesc(n);
          detailPlay.textContent =
            (savedPos(n) > 30 ? 'Resume · Episode ' : 'Play · Episode ') + n;
          detailTitle.textContent = EP_TITLES[n] ? EP_TITLES[n] : 'Episode ' + n;
          detailDesc.textContent = d;
          detailDesc.style.display = d ? '' : 'none';
          sheet.classList.add('detail-open');
        }
        function closeDetail() {
          sheet.classList.remove('detail-open');
          detailEp = null;
        }
        document.getElementById('detailBack').addEventListener('click', closeDetail);
        detailPlay.addEventListener('click', function () {
          if (detailEp == null) return;
          var n = detailEp;
          closeSheet();
          if (n !== current) loadEpisode(n);
          else { tryPlay(); }
        });

        /* Search lives inside the Library, collapsed until the
           magnifier asks for it, and nowhere else. */
        document.getElementById('searchToggle').addEventListener('click', function () {
          var open = sheetSearch.classList.toggle('open');
          if (open) { try { libSearch.focus(); } catch (e) {} }
        });
        var SEARCH_TEXT = null;
        function searchTextFor(n) {
          if (!SEARCH_TEXT) {
            SEARCH_TEXT = {};
            for (var k = 1; k <= TOTAL; k++) {
              SEARCH_TEXT[k] = ((EP_TITLES[k] || '') + ' ' + getDesc(k)).toLowerCase();
            }
          }
          return SEARCH_TEXT[n];
        }
        function filterLibrary() {
          var q = (libSearch.value || '').toLowerCase().replace(/^\s+|\s+$/g, '');
          var anyVisible = false;
          var groups = sheetList.querySelectorAll('.saga-group');
          for (var g = 0; g < groups.length; g++) {
            var sagaName = groups[g].getAttribute('data-saga');
            var rows = groups[g].querySelectorAll('.ep-row');
            var groupVisible = false;
            for (var i = 0; i < rows.length; i++) {
              var n = parseInt(rows[i].getAttribute('data-ep'), 10);
              var metaText = searchTextFor(n);
              var match = !q ||
                String(n).indexOf(q) !== -1 ||
                ('episode ' + n).indexOf(q) !== -1 ||
                sagaName.indexOf(q) !== -1 ||
                (sagaName + ' saga').indexOf(q) !== -1 ||
                metaText.indexOf(q) !== -1;
              rows[i].style.display = match ? '' : 'none';
              if (match) groupVisible = true;
            }
            groups[g].style.display = groupVisible ? '' : 'none';
            if (groupVisible) anyVisible = true;
          }
          setClass(libEmpty, 'show', !anyVisible);
          if (q) sheetList.scrollTop = 0;
        }
        var filterTimer = null;
        libSearch.addEventListener('input', function () {
          if (filterTimer) clearTimeout(filterTimer);
          filterTimer = setTimeout(filterLibrary, 120);
        });

        function openSheet() {
          buildSheet();
          refreshSheet();
          closeDetail();
          sheet.classList.add('open');
          backdrop.classList.add('open');
          sheet.setAttribute('aria-hidden', 'false');
          var cur = sheetList.querySelector('.ep-row.current');
          if (cur) {
            var top = cur.getBoundingClientRect().top - sheetList.getBoundingClientRect().top
              + sheetList.scrollTop - sheetList.clientHeight / 2 + 30;
            sheetList.scrollTop = Math.max(0, top);
          }
        }
        function closeSheet() {
          closeDetail();
          sheet.classList.remove('open');
          backdrop.classList.remove('open');
          sheet.setAttribute('aria-hidden', 'true');
          sheetSearch.classList.remove('open');
          if (libSearch.value) {
            libSearch.value = '';
            filterLibrary();
          }
        }
        document.getElementById('libraryBtn').addEventListener('click', openSheet);
        document.getElementById('sheetDone').addEventListener('click', closeSheet);
        backdrop.addEventListener('click', closeSheet);
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          if (sheet.classList.contains('detail-open')) closeDetail();
          else closeSheet();
        });

        /* ----- the TV. The session starting IS the decision —
                 the current episode goes to the TV. ----- */
        window['__onGCastApiAvailable'] = function (isAvailable) {
          if (!isAvailable || !window.cast || !window.chrome) return;
          try {
            var ctx = cast.framework.CastContext.getInstance();
            ctx.setOptions({
              receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
              autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            ctx.addEventListener(
              cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
              function (ev) {
                if (ev.sessionState === cast.framework.SessionState.SESSION_STARTED ||
                    ev.sessionState === cast.framework.SessionState.SESSION_RESUMED) {
                  castSession = ctx.getCurrentSession();
                  castLoad(current, video.currentTime || savedPos(current));
                } else if (ev.sessionState === cast.framework.SessionState.SESSION_ENDED) {
                  castSession = null;
                  tryPlay(); /* no TV anymore — play here */
                }
              }
            );
          } catch (e) { /* Cast unavailable in this browser */ }
        };

        function castLoad(n, at) {
          if (!castSession || !window.chrome) return;
          try {
            var info = new chrome.cast.media.MediaInfo(epUrl(n), 'video/mp4');
            var req = new chrome.cast.media.LoadRequest(info);
            req.currentTime = at || 0;
            req.autoplay = true;
            castSession.loadMedia(req);
            try { video.pause(); } catch (e) {}
          } catch (e) {}
        }

        /* Leaving — by tab, app switch, or kill — saves the moment. */
        window.addEventListener('beforeunload', savePosition);
        window.addEventListener('pagehide', savePosition);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') savePosition();
          /* Time away is not a stall: the progress clock restarts
             on return, whatever the stream did while unwatched. */
          else lastProgressAt = Date.now();
        });

        /* The Cast SDK is three requests to gstatic that used to block
           startup. A TV is a sometime thing; the episode is the thing.
           Load the SDK lazily once the page is up — __onGCastApiAvailable
           above is already registered, so it wires itself up on arrival. */
        function loadCastSdk() {
          /* The modern Cast framework cannot run on older Chrome;
             on the A9 its three requests would only delay the
             episode. Casting there is the phone's system route,
             not this SDK. */
          if (LEGACY) return;
          var sc = document.createElement('script');
          sc.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
          sc.async = true;
          document.head.appendChild(sc);
        }
        if (document.readyState === 'complete') {
          setTimeout(loadCastSdk, 1800);
        } else {
          window.addEventListener('load', function () { setTimeout(loadCastSdk, 1800); });
        }

        /* ----- open the link: your episode, where you left off ----- */
        renderEdition();
        loadEpisode(current);
      })();
    </script>
  </body>
